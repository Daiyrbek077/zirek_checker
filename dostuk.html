<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достук 2.0 - Официант тиркемеси</title>
    <style>
        /* Tunduk Design System Tokens - Dark Theme[span_4](start_span)[span_4](end_span) */
        :root {
            --bg: #0f1412;
            --surface: #1a211e;
            --primary: #3ccf8e;
            --primary-soft: #173528;
            --accent: #ffcc3d;
            --danger: #ff6b6f;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif; /*[span_5](start_span)[span_5](end_span) */
            margin: 0; 
            padding: 0;
            padding-bottom: 90px; /* Space for tab-bar */
        }

        /* Top Header[span_6](start_span)[span_6](end_span) */
        .header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 44px; height: 44px;
            background: var(--surface);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }
        .header-title { font-size: 16px; font-weight: 500; }
        .header-subtitle { font-size: 14px; color: var(--text-muted); }
        .bell-icon { position: relative; font-size: 24px; }
        .badge {
            position: absolute; top: -5px; right: -10px;
            background: var(--danger);
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Ready Banner (ITEM_READY event)[span_7](start_span)[span_7](end_span) */
        .ready-banner {
            background: var(--primary);
            color: #0f1412;
            padding: 16px;
            margin: 0 24px 24px;
            border-radius: 20px;
            font-weight: 700;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-ready {
            background: #0f1412; color: var(--primary);
            border: none; padding: 8px 16px; border-radius: 12px;
            font-weight: bold; cursor: pointer;
        }

        /* Tables Grid (3 columns)[span_8](start_span)[span_8](end_span)[span_9](start_span)[span_9](end_span) */
        .section-title { padding: 0 24px; font-size: 24px; font-weight: 800; margin-bottom: 16px; }
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 24px;
        }
        .table-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            height: 70px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .table-number { font-size: 18px; font-weight: 700; }
        .table-amount { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* Table Status Colors[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span) */
        .table-card.empty { background: var(--surface); border: 1px solid #333; }
        .table-card.occupied { background: var(--primary-soft); color: var(--primary); }
        .table-card.ready { background: var(--primary); color: #0f1412; }
        .table-card.ready .table-amount { color: #0f1412; opacity: 0.8; }

        /* 5-Position Bottom Tab Bar[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span) */
        .tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .tab-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            gap: 4px;
        }
        .tab-item.active { color: var(--primary); }
        .tab-icon { font-size: 24px; }
        
        /* Central QR Scanner Button[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span) */
        .scan-btn-wrapper {
            position: relative; top: -20px;
        }
        .scan-btn {
            background: var(--accent);
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 24px;
            color: #0f1412;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header[span_16](start_span)[span_16](end_span) -->
    <header class="header">
        <div class="profile-info">
            <div class="avatar">👤</div>
            <div>
                <div class="header-title">Азамат</div>
                <div class="header-subtitle">Официант • Смена №42</div>
            </div>
        </div>
        <div class="bell-icon">
            🔔<span class="badge" id="notification-badge">1</span>
        </div>
    </header>

    <!-- Green Banner for Ready Items[span_17](start_span)[span_17](end_span) -->
    <div class="ready-banner" id="ready-banner">
        <div>
            <div>Стол 5: Шашлык, Шорпо</div>
            <div style="font-size: 12px; font-weight: 500;">Ашканадан даяр болду</div>
        </div>
        <button class="btn-ready" onclick="dismissBanner()">Алып бардым</button>
    </div>

    <!-- Table Grid[span_18](start_span)[span_18](end_span) -->
    <div class="section-title">Үстөлдөр</div>
    <div class="tables-grid">
        <div class="table-card occupied" onclick="openOrder(1)">
            <div class="table-number">1</div>
            <div class="table-amount">1 250 c.</div>
        </div>
        <div class="table-card empty" onclick="openOrder(2)">
            <div class="table-number">2</div>
            <div class="table-amount">Бош</div>
        </div>
        <div class="table-card ready" onclick="openOrder(3)">
            <div class="table-number">3</div>
            <div class="table-amount">Даяр!</div>
        </div>
        <div class="table-card empty" onclick="openOrder(4)">
            <div class="table-number">4</div>
            <div class="table-amount">Бош</div>
        </div>
        <div class="table-card occupied" onclick="openOrder(5)">
            <div class="table-number">5</div>
            <div class="table-amount">450 c.</div>
        </div>
        <div class="table-card empty" onclick="openOrder(6)">
            <div class="table-number">6</div>
            <div class="table-amount">Бош</div>
        </div>
    </div>

    <!-- Bottom Tab Bar (5 positions)[span_19](start_span)[span_19](end_span)[span_20](start_span)[span_20](end_span) -->
    <div class="tab-bar">
        <div class="tab-item active">
            <div class="tab-icon">🔲</div>
            <span>Үстөлдөр</span>
        </div>
        <div class="tab-item">
            <div class="tab-icon">🧾</div>
            <span>Заказдар</span>
        </div>
        <div class="scan-btn-wrapper">
            <div class="scan-btn" onclick="openScanner()">QR</div>
        </div>
        <div class="tab-item">
            <div class="tab-icon">🕒</div>
            <span>Тарых</span>
        </div>
        <div class="tab-item">
            <div class="tab-icon">⚙️</div>
            <span>Дагы</span>
        </div>
    </div>

    <script>
        // Dismiss ready banner simulation[span_21](start_span)[span_21](end_span)
        function dismissBanner() {
            document.getElementById('ready-banner').style.display = 'none';
            document.getElementById('notification-badge').style.display = 'none';
            // Change table 3 from 'ready' to 'occupied'
            const table3 = document.querySelectorAll('.table-card')[2];
            table3.className = 'table-card occupied';
            table3.querySelector('.table-amount').innerText = '900 c.';
        }

        function openScanner() {
            alert("QR сканер ачылууда (Толук экран)..."); //[span_22](start_span)[span_22](end_span)
        }

        function openOrder(tableId) {
            alert(`Стол №${tableId} Заказ экраны ачылууда...`);
        }
    </script>
</body>
</html>
