<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zirek Service 1.01 — Толук Системанын Прототиби</title>
<style>
:root {
--bg-color: #121212;
--surface-color: #1e1e1e;
--surface-card: #252525;
--primary: #ff9800;
--primary-hover: #e68900;
--success: #4caf50;
--danger: #f44336;
--text-main: #ffffff;
--text-muted: #aaaaaa;
--border: #333333;
}
body {
background-color: var(--bg-color);
color: var(--text-main);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin: 0;
padding: 0;
display: flex;
justify-content: center;
}
.container {
width: 100%;
max-width: 480px;
height: 100vh;
background-color: var(--bg-color);
display: flex;
flex-direction: column;
position: relative;
box-shadow: 0 0 20px rgba(0,0,0,0.8);
overflow: hidden;
}
header {
background-color: var(--surface-color);
padding: 12px 15px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid var(--border);
}
.brand {
font-size: 1rem;
font-weight: bold;
color: var(--primary);
display: flex;
align-items: center;
gap: 6px;
}
.role-switcher select {
background: #333;
color: white;
border: 1px solid var(--border);
padding: 4px 8px;
border-radius: 6px;
font-size: 0.85rem;
}
.content {
flex: 1;
overflow-y: auto;
padding: 15px;
padding-bottom: 80px;
}
.screen {
display: none;
}
.screen.active {
display: block;
}
.section-title {
font-size: 1.1rem;
margin-bottom: 15px;
color: var(--text-muted);
display: flex;
justify-content: space-between;
align-items: center;
}
/* Cards */
.card {
background-color: var(--surface-card);
border-radius: 12px;
padding: 15px;
margin-bottom: 15px;
border-left: 5px solid var(--primary);
box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.card-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}
.card-title {
font-size: 1.1rem;
font-weight: bold;
}
.badge {
background-color: #333;
padding: 3px 8px;
border-radius: 6px;
font-size: 0.8rem;
font-weight: bold;
}
.badge-success { background: rgba(76, 175, 80, 0.2); color: var(--success); border: 1px solid var(--success); }
.badge-danger { background: rgba(244, 67, 54, 0.2); color: var(--danger); border: 1px solid var(--danger); }
.card-details {
font-size: 0.9rem;
color: var(--text-muted);
margin-bottom: 10px;
}
.card-footer {
display: flex;
justify-content: space-between;
align-items: center;
border-top: 1px solid var(--border);
padding-top: 10px;
}
/* Buttons & Inputs */
.btn {
width: 100%;
padding: 12px;
border: none;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
.btn-primary { background-color: var(--primary); color: white; }
.btn-primary:hover { background-color: var(--primary-hover); }
.btn-success { background-color: var(--success); color: white; }
.btn-danger { background-color: rgba(244, 67, 54, 0.2); color: var(--danger); border: 1px solid var(--danger); }
.form-group {
margin-bottom: 15px;
}
.form-label {
display: block;
margin-bottom: 5px;
font-size: 0.85rem;
color: var(--text-muted);
}
.form-input {
width: 100%;
padding: 10px;
background-color: var(--bg-color);
border: 1px solid var(--border);
border-radius: 8px;
color: white;
font-size: 0.95rem;
box-sizing: border-box;
}
/* FAB */
.fab {
position: absolute;
bottom: 20px;
right: 20px;
width: 60px;
height: 60px;
background-color: var(--primary);
color: white;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
font-size: 2.2rem;
box-shadow: 0 6px 15px rgba(255, 152, 0, 0.4);
cursor: pointer;
border: none;
z-index: 10;
}
/* Modals */
.modal-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background-color: rgba(0,0,0,0.8);
display: none;
justify-content: center;
align-items: center;
z-index: 100;
padding: 20px;
}
.modal-card {
background-color: var(--surface-color);
width: 100%;
max-width: 380px;
border-radius: 16px;
padding: 20px;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
max-height: 85vh;
overflow-y: auto;
}
.modal-title {
font-size: 1.2rem;
font-weight: bold;
margin-bottom: 15px;
display: flex;
justify-content: space-between;
align-items: center;
}
.close-btn {
background: none;
border: none;
color: var(--text-muted);
font-size: 1.4rem;
cursor: pointer;
}
/* Receipt */
.receipt-container {
background-color: #fff;
color: #000;
padding: 20px;
border-radius: 8px;
font-family: 'Courier New', Courier, monospace;
text-align: center;
position: relative;
width: 85%;
max-width: 320px;
}
.timer-bar {
height: 4px;
background-color: var(--primary);
width: 100%;
position: absolute;
bottom: 0;
left: 0;
animation: shrink 30s linear forwards;
border-bottom-left-radius: 8px;
border-bottom-right-radius: 8px;
}
@keyframes shrink {
from { width: 100%; }
to { width: 0%; }
}
</style>
</head>
<body>
<div class="container">
<!-- Header -->
<header>
<div class="brand">
<span>⚡ Zirek 1.01</span>
</div>
<div class="role-switcher">
<select id="role-select" onchange="switchRole(this.value)">
<option value="waiter">Официант</option>
<option value="chef">Ашпозчу</option>
<option value="admin">Администратор</option>
<option value="qr">QR Меню (Кардар)</option>
</select>
</div>
</header>
<!-- Main Content -->
<div class="content">
<!-- 1. ОФИЦИАНТ ЭКРАНЫ -->
<div id="screen-waiter" class="screen active">
<div class="section-title">
<span>Активдүү заказдар</span>
<span id="waiter-order-count">0 заказ</span>
</div>
<div id="waiter-orders-list"></div>
<button class="fab" onclick="openNewOrderModal()">+</button>
</div>
<!-- 2. АШПОЗЧУ ЭКРАНЫ -->
<div id="screen-chef" class="screen">
<div class="section-title">
<span>Ашкана Цехи (Жаңы жана Даярдалууда)</span>
</div>
<div id="chef-orders-list"></div>
</div>
<!-- 3. АДМИН ЭКРАНЫ -->
<div id="screen-admin" class="screen">
<div class="section-title"><span>Админ панель</span></div>
<div class="card" style="border-left-color: var(--success);">
<div class="card-title" style="margin-bottom:10px;">Бүгүнкү Финансылык Отчет</div>
<div id="admin-report-body" style="font-size: 0.95rem; display:flex; flex-direction:column; gap:5px;">
<div>Киреше: <b style="color:var(--success);" id="rep-income">0с</b></div>
<div>Чыгымдар: <b style="color:var(--danger);" id="rep-expense">0с</b></div>
<div>Таза касса: <b style="color:var(--primary);" id="rep-net">0с</b></div>
</div>
</div>
<div class="card">
<div class="card-title" style="margin-bottom:10px;">Чыгым киргизүү</div>
<div class="form-group"><input type="number" id="exp-amount" class="form-input" placeholder="Суммасы (сом)"></div>
<div class="form-group">
<select id="exp-cat" class="form-input">
<option value="products">Продукта</option>
<option value="salary">Айлык</option>
<option value="other">Башка</option>
</select>
</div>
<div class="form-group"><input type="text" id="exp-desc" class="form-input" placeholder="Себеби / Маалымат"></div>
<button class="btn btn-primary" onclick="addExpense()">Чыгымды сактоо</button>
</div>
<div class="card">
<div class="card-title" style="margin-bottom:10px;">Стоп-лист (Меню башкаруу)</div>
<div id="admin-menu-list"></div>
</div>
</div>
<!-- 4. QR МЕНЮ (КАРДАР) -->
<div id="screen-qr" class="screen">
<div class="section-title"><span>Стол №3 — Онлайн Меню</span></div>
<div id="qr-menu-list"></div>
<div style="margin-top: 20px;">
<button class="btn btn-primary" onclick="submitQrOrder()">Заказды ашканага жөнөтүү</button>
</div>
</div>
</div>
<!-- NEW ORDER MODAL (Waiter) -->
<div id="modal-new-order" class="modal-overlay">
<div class="modal-card">
<div class="modal-title">
<span>Жаңы заказ</span>
<button class="close-btn" onclick="closeModal('modal-new-order')">×</button>
</div>
<div class="form-group">
<label class="form-label">Клиенттин аты</label>
<input type="text" id="new-cust" class="form-input" value="Нурбек">
</div>
<div class="form-group">
<label class="form-label">Стол №</label>
<input type="number" id="new-table" class="form-input" value="3">
</div>
<div class="form-group">
<label class="form-label">Тамактарды тандоо</label>
<div style="display:flex; flex-direction:column; gap:8px;" id="menu-select-items"></div>
</div>
<div style="margin: 10px 0; font-size: 0.9rem; color: var(--text-muted);" id="draft-summary">Тамактар тандала элек</div>
<button class="btn btn-primary" onclick="submitWaiterOrder()">Ашканага жиберүү</button>
</div>
</div>
<!-- ORDER DETAIL MODAL -->
<div id="modal-detail" class="modal-overlay">
<div class="modal-card">
<div class="modal-title">
<span id="detail-title">Заказ №001</span>
<button class="close-btn" onclick="closeModal('modal-detail')">×</button>
</div>
<div id="detail-body" style="margin-bottom: 15px;"></div>
<button class="btn btn-success" style="margin-bottom:10px;" onclick="payOrder()">Төлдү (Чек чыгаруу)</button>
<button class="btn btn-danger" onclick="cancelOrderAdmin()">Админ: Отмена кылуу</button>
</div>
</div>
<!-- RECEIPT MODAL (30s) -->
<div id="modal-receipt" class="modal-overlay">
<div class="receipt-container">
<div style="text-align: right; cursor: pointer; color: #000; font-weight: bold; font-size: 1.2rem;" onclick="closeModal('modal-receipt')">×</div>
<div style="font-weight: bold; font-size: 1.2rem;">ZIREK SERVICE POS</div>
<div style="font-size: 0.8rem; margin-bottom: 10px;">Виртуалдык чек</div>
<div id="receipt-content" style="font-size: 0.85rem; text-align: left; margin: 10px 0;"></div>
<div class="timer-bar"></div>
</div>
</div>
</div>
<script>
// Mock Database State
let menu = [
{ id: 1, name: "Манты", price: 250, category: "hot_food", active: true },
{ id: 2, name: "Шашлык", price: 300, category: "grill", active: true },
{ id: 3, name: "Шорпо", price: 220, category: "hot_food", active: true },
{ id: 4, name: "Кола 0.5", price: 100, category: "drinks", active: true }
];
let orders = [
{
id: 1,
number: "#001",
customer: "Нурбек",
table: 3,
time: "18:25",
status: "active", // active, paid, cancelled
items: [
{ name: "Манты", qty: 2, price: 250, status: "cooking" },
{ name: "Кола 0.5", qty: 1, price: 100, status: "ready" }
]
}
];
let expenses = [];
let draftItems = [];
let qrCart = {};
let activeOrderId = null;
let receiptTimer = null;
let orderCounter = 2;
function switchRole(role) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(screen-${role}).classList.add('active');
if(role === 'waiter') renderWaiterOrders();
if(role === 'chef') renderChefOrders();
if(role === 'admin') renderAdminPanel();
if(role === 'qr') renderQrMenu();
}
// --- WAITER LOGIC ---
function renderWaiterOrders() {
const list = document.getElementById('waiter-orders-list');
const count = document.getElementById('waiter-order-count');
const activeOrders = orders.filter(o => o.status === 'active');
count.innerText = ${activeOrders.length} заказ;
list.innerHTML = '';
if(activeOrders.length === 0) {
list.innerHTML = <div style="text-align:center; color:var(--text-muted); margin-top:40px;">Активдүү заказдар жок</div>;
return;
}
activeOrders.forEach(o => {
let total = o.items.reduce((s, i) => s + (i.price * i.qty), 0);
let itemsDesc = o.items.map(i => ${i.name} x${i.qty}).join(', ');
list.innerHTML += <div class="card" onclick="openDetail(${o.id})"> <div class="card-header"> <span class="card-title">${o.number} — ${o.customer}</span> <span class="badge">Стол №${o.table}</span> </div> <div class="card-details">Тамактар: ${itemsDesc}<br>Убакыт: ${o.time}</div> <div class="card-footer"> <span style="color:var(--success); font-weight:bold;">${total} сом</span> <span style="color:var(--primary); font-size:0.85rem;">Ашканада</span> </div> </div>;
});
}
function openNewOrderModal() {
draftItems = [];
const container = document.getElementById('menu-select-items');
container.innerHTML = menu.filter(m => m.active).map(m => <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-card); padding:8px; border-radius:6px;"> <span>${m.name} (${m.price}с)</span> <button class="btn btn-primary" style="width:auto; padding:4px 10px;" onclick="addDraftItem(${m.id})">Кошуу</button> </div>).join('');
updateDraftUI();
document.getElementById('modal-new-order').style.display = 'flex';
}
function addDraftItem(id) {
let item = menu.find(m => m.id === id);
let exist = draftItems.find(d => d.id === id);
if(exist) exist.qty++;
else draftItems.push({ id: item.id, name: item.name, price: item.price, qty: 1, status: 'new' });
updateDraftUI();
}
function updateDraftUI() {
let summary = document.getElementById('draft-summary');
if(draftItems.length === 0) summary.innerText = "Тамактар тандала элек";
else summary.innerHTML = draftItems.map(d => • ${d.name} x${d.qty}).join('
');
}
function submitWaiterOrder() {
if(draftItems.length === 0) { alert("Тамак тандаңыз!"); return; }
let now = new Date();
let newOrd = {
id: Date.now(),
number: #${String(orderCounter++).padStart(3, '0')},
customer: document.getElementById('new-cust').value || "Мейман",
table: parseInt(document.getElementById('new-table').value) || 1,
time: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')},
status: 'active',
items: JSON.parse(JSON.stringify(draftItems))
};
orders.push(newOrd);
closeModal('modal-new-order');
renderWaiterOrders();
alert("Заказ ашканага WebSocket аркылуу жөнөтүлдү!");
}
function openDetail(id) {
activeOrderId = id;
let o = orders.find(x => x.id === id);
if(!o) return;
document.getElementById('detail-title').innerText = Заказ ${o.number} (${o.customer});
let total = o.items.reduce((s, i) => s + (i.price * i.qty), 0);
document.getElementById('detail-body').innerHTML = <div style="color:var(--text-muted); margin-bottom:10px;">Стол №${o.table} | Убакыт: ${o.time}</div> <div style="border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 0;"> ${o.items.map(i =><div style="display:flex; justify-content:space-between;"><span>{i.name} x{i.qty}</span><b>${i.price * i.qty}с</b></div>).join('')} </div> <div style="display:flex; justify-content:space-between; margin-top:10px; font-size:1.1rem; font-weight:bold;"> <span>Жалпы:</span><span style="color:var(--success);">${total} сом</span> </div> ;
document.getElementById('modal-detail').style.display = 'flex';
}
function payOrder() {
let o = orders.find(x => x.id === activeOrderId);
if(!o) return;
o.status = 'paid';
closeModal('modal-detail');
renderWaiterOrders();
let total = o.items.reduce((s, i) => s + (i.price * i.qty), 0);
document.getElementById('receipt-content').innerHTML = <b>Заказ:</b> ${o.number} (${o.customer})<br> <b>Стол:</b> №${o.table}<br> <hr style="border:0; border-top:1px dashed #000; margin:8px 0;"> ${o.items.map(i =><div>{i.name} x{i.qty} —${i.price * i.qty}с</div>).join('')} <hr style="border:0; border-top:1px dashed #000; margin:8px 0;"> <b>ЖАЛПЫ: ${total} СОМ</b> ;
document.getElementById('modal-receipt').style.display = 'flex';
if(receiptTimer) clearTimeout(receiptTimer);
receiptTimer = setTimeout(() => closeModal('modal-receipt'), 30000);
}
function cancelOrderAdmin() {
let reason = prompt("Админ сырсөзү / Отмена кылуу себеби:");
if(reason) {
let o = orders.find(x => x.id === activeOrderId);
if(o) o.status = 'cancelled';
closeModal('modal-detail');
renderWaiterOrders();
alert("Заказ админ тарабынан жокко чыгарылды.");
}
}
// --- CHEF LOGIC ---
function renderChefOrders() {
let list = document.getElementById('chef-orders-list');
let activeOrders = orders.filter(o => o.status === 'active');
list.innerHTML = '';
if(activeOrders.length === 0) {
list.innerHTML = <div style="text-align:center; color:var(--text-muted); margin-top:40px;">Жаңы заказдар жок</div>;
return;
}
activeOrders.forEach(o => {
list.innerHTML += <div class="card"> <div class="card-header"><span class="card-title">${o.number} (Стол №${o.table})</span></div> <div class="card-details"> ${o.items.map((i, idx) =>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
<span>{i.name} x{i.qty} [Статус: <b>${i.status}</b>]</span>
<div>
<button class="btn btn-primary" style="padding:2px 6px; font-size:0.75rem;" onclick="updateItemStatus(${o.id},${idx}, 'cooking')">Жасоодо</button>
<button class="btn btn-success" style="padding:2px 6px; font-size:0.75rem;" onclick="updateItemStatus(${o.id},${idx}, 'ready')">Даяр</button>
</div>
</div>
).join('')} </div> </div> ;
});
}
function updateItemStatus(orderId, itemIdx, status) {
let o = orders.find(x => x.id === orderId);
if(o) {
o.items[itemIdx].status = status;
renderChefOrders();
}
}
// --- ADMIN LOGIC ---
function renderAdminPanel() {
let paid = orders.filter(o => o.status === 'paid');
let income = paid.reduce((sum, ord) => sum + ord.items.reduce((s, i) => s + (i.price * i.qty), 0), 0);
let expTotal = expenses.reduce((s, e) => s + e.amount, 0);
document.getElementById('rep-income').innerText = ${income}с;
document.getElementById('rep-expense').innerText = ${expTotal}с;
document.getElementById('rep-net').innerText = ${income - expTotal}с;
let menuList = document.getElementById('admin-menu-list');
menuList.innerHTML = menu.map(m => <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-color); padding:8px; border-radius:6px; margin-bottom:6px;"> <span>${m.name} (${m.price}с) — ${m.active ? '✅ Менюда' : '❌ Стоп-лист'}</span> <button class="btn btn-danger" style="width:auto; padding:4px 8px; font-size:0.8rem;" onclick="toggleStopList(${m.id})">Которгуч</button> </div>).join('');
}
function addExpense() {
let amount = parseFloat(document.getElementById('exp-amount').value);
let cat = document.getElementById('exp-cat').value;
let desc = document.getElementById('exp-desc').value;
if(!amount || amount <= 0) { alert("Туура сумма жазыңыз"); return; }
expenses.push({ amount, cat, desc });
document.getElementById('exp-amount').value = '';
document.getElementById('exp-desc').value = '';
renderAdminPanel();
alert("Чыгым ийгиликтүү кошулду!");
}
function toggleStopList(id) {
let m = menu.find(x => x.id === id);
if(m) {
m.active = !m.active;
renderAdminPanel();
}
}
// --- QR MENU LOGIC ---
function renderQrMenu() {
let list = document.getElementById('qr-menu-list');
list.innerHTML = menu.filter(m => m.active).map(m => <div class="card" style="border-left-color: var(--success); display:flex; justify-content:space-between; align-items:center;"> <div> <div class="card-title">${m.name}</div> <div style="color:var(--success); font-weight:bold; margin-top:5px;">${m.price} сом</div> </div> <div style="display:flex; align-items:center; gap:8px;"> <button class="btn btn-primary" style="width:30px; height:30px; padding:0;" onclick="changeQrQty(${m.id}, -1)">-</button> <span id="qr-qty-${m.id}" style="font-weight:bold;">0</span> <button class="btn btn-primary" style="width:30px; height:30px; padding:0;" onclick="changeQrQty(${m.id}, 1)">+</button> </div> </div>).join('');
}
function changeQrQty(id, change) {
if(!qrCart[id]) qrCart[id] = 0;
qrCart[id] += change;
if(qrCart[id] < 0) qrCart[id] = 0;
document.getElementById(qr-qty-${id}).innerText = qrCart[id];
}
function submitQrOrder() {
let items = [];
for(let id in qrCart) {
if(qrCart[id] > 0) {
let m = menu.find(x => x.id == id);
items.push({ name: m.name, price: m.price, qty: qrCart[id], status: 'new' });
}
}
if(items.length === 0) { alert("Корзина бош!"); return; }
let now = new Date();
orders.push({
id: Date.now(),
number: #${String(orderCounter++).padStart(3, '0')},
customer: "QR Мейман (Стол 3)",
table: 3,
time: ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')},
status: 'active',
items: items
});
qrCart = {};
renderQrMenu();
alert("Заказыңыз ашканага жана официанттарга ийгиликтүү жөнөтүлдү!");
}
function closeModal(id) {
document.getElementById(id).style.display = 'none';
}
// Init
renderWaiterOrders();
</script>
