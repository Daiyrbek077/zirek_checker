<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе Автоматизациясы (POS)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Сол тарап: Меню жана Столдор */
        .main-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tables-bar {
            display: flex;
            gap: 10px;
        }

        .table-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .table-btn.active {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            overflow-y: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card h4 {
            margin-bottom: 8px;
            color: #333;
        }

        .card span {
            color: #e67e22;
            font-weight: bold;
        }

        /* Оң тарап: Чек / Заказ */
        .order-panel {
            width: 380px;
            background: white;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .order-header {
            border-bottom: 2px solid #f4f6f9;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .order-items {
            flex: 1;
            overflow-y: auto;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
        }

        .order-footer {
            border-top: 2px solid #f4f6f9;
            padding-top: 15px;
        }

        .total-price {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .pay-btn {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #219150;
        }
    </style>
</head>
<body>

    <div class="main-panel">
        <div class="header">
            <h2>"Даамдуу" Кафеси</h2>
            <div class="tables-bar">
                <button class="table-btn active">Стол №1</button>
                <button class="table-btn">Стол №2</button>
                <button class="table-btn">Стол №3</button>
                <button class="table-btn">VIP Стол</button>
            </div>
        </div>

        <h3>Меню</h3>
        <div class="menu-grid">
            <div class="card" onclick="addItem('Бургер', 220)">
                <h4>Бургер</h4>
                <span>220 сом</span>
            </div>
            <div class="card" onclick="addItem('Пицца Маргарита', 450)">
                <h4>Пицца</h4>
                <span>450 сом</span>
            </div>
            <div class="card" onclick="addItem('Шашлык (Тоок)', 180)">
                <h4>Шашлык</h4>
                <span>180 сом</span>
            </div>
            <div class="card" onclick="addItem('Фри картошкасы', 120)">
                <h4>Фри</h4>
                <span>120 сом</span>
            </div>
            <div class="card" onclick="addItem('Капучино', 150)">
                <h4>Капучино</h4>
                <span>150 сом</span>
            </div>
            <div class="card" onclick="addItem('Кара чай', 50)">
                <h4>Кара чай</h4>
                <span>50 сом</span>
            </div>
        </div>
    </div>

    <div class="order-panel">
        <div class="order-header">
            <h3>Учурдагы заказ (Стол №1)</h3>
        </div>

        <div class="order-items" id="itemList">
            </div>

        <div class="order-footer">
            <div class="total-price">
                <span>Жалпы:</span>
                <span id="totalSum">0 сом</span>
            </div>
            <button class="pay-btn" onclick="checkout()">Төлөө жана Чек чыгаруу</button>
        </div>
    </div>

    <script>
        let total = 0;

        function addItem(name, price) {
            const list = document.getElementById('itemList');
            
            const itemDiv = document.createElement('div');
            itemDiv.className = 'order-item';
            itemDiv.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <small>${price} сом</small>
                </div>
                <span>1 даана</span>
            `;
            
            list.appendChild(itemDiv);

            total += price;
            document.getElementById('totalSum').innerText = total + ' сом';
        }

        function checkout() {
            if(total === 0) {
                alert("Заказ бош!");
                return;
            }
            alert("Төлөм кабыл алынды! Жалпы сумма: " + total + " сом");
            document.getElementById('itemList').innerHTML = '';
            total = 0;
            document.getElementById('totalSum').innerText = '0 сом';
        }
    </script>
</body>
</html>
