<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D canvas, floating layer panel top-left, mode bar bottom-center */
:root {
  --bg: #e9eef2; --fg: #1d2125; --fg2: #545b62; --accent: #3d5a6c;
  --panel: rgba(255,255,255,0.93); --line: rgba(29,33,37,0.10); --chip: #eef1f3;
  --font: 'Golos Text', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191c; --fg: #e6e8ea; --fg2: #9aa3ab; --accent: #9cc0d6;
  --panel: rgba(30,34,38,0.94); --line: rgba(255,255,255,0.10); --chip: #262b30; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #16191c; --fg: #e6e8ea; --fg2: #9aa3ab; --accent: #9cc0d6;
  --panel: rgba(30,34,38,0.94); --line: rgba(255,255,255,0.10); --chip: #262b30; color-scheme: dark;
}
* { margin: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
#c { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }

#panel {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 252px; max-height: calc(100% - 110px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); z-index: 10;
}
#panel summary { list-style: none; cursor: pointer; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 3px; }
#panel summary::-webkit-details-marker { display: none; }
#panel summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
#panel h1 { font-size: 15px; font-weight: 600; text-wrap: balance; }
#panel .spec { font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; line-height: 1.45; }
#panel .hint { font-size: 11px; color: var(--accent); }
#panel[open] .hint { display: none; }
.layers { padding: 4px 8px 12px; display: flex; flex-direction: column; }
.grp-title { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); padding: 10px 8px 4px; }
.layer { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; user-select: none; }
.layer:hover { background: var(--chip); }
.layer input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
.layer .sw { width: 16px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--line); }
.layer .nm { flex: 1; }
.layer .sub { font-size: 11px; color: var(--fg2); }
.lvls { display: flex; gap: 6px; padding: 2px 8px 4px; }
.lvls .layer { flex: 1; background: var(--chip); justify-content: center; }

#bar {
  position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; align-items: center; z-index: 10;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center;
}
.seg { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button, #reset {
  font-family: inherit; font-size: 13px; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer;
  background: transparent; color: var(--fg2);
}
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
#reset { color: var(--accent); font-weight: 500; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tip { font-size: 12px; color: var(--fg2); padding: 0 6px; }
@media (max-width: 560px) { .tip { display: none; } #panel { width: min(252px, calc(100% - 32px)); } }
</style>

<canvas id="c"></canvas>

<details id="panel" open>
  <summary>
    <h1>Магазин · 2 кабат</h1>
    <span class="spec">18.0 × 13.5 м · кабат бийиктиги 3.3 м<br>Соода залдары 2 × ≈ 85 м² · кире бериш 36 м²</span>
    <span class="hint">Катмарлар ▾</span>
  </summary>
  <div class="layers">
    <div class="grp-title">Кабаттар</div>
    <div class="lvls">

    <label class="layer"><input type="checkbox" id="t-found" checked><span class="sw" style="background:#9aa0a5"></span><span class="nm">Фундамент <span class="sub">ленталуу</span></span></label>

    <label class="layer"><input type="checkbox" id="t-frame" checked><span class="sw" id="sw-frame" style="background:#5f5851"></span><span class="nm">Каркас <span class="sub">колонна, балка</span></span></label>

    <label class="layer"><input type="checkbox" id="t-equip" checked><span class="sw" style="background:#d9503a"></span><span class="nm">Жабдуу <span class="sub">стеллаж, касса, вывеска</span></span></label>

    <div class="grp-title">Белгилер</div>
    <label class="layer"><input type="checkbox" id="t-labels" checked><span class="sw" style="background:#3d5a6c"></span><span class="nm">Бөлмөлөр, огдор</span></label>
    <label class="layer"><input type="checkbox" id="t-dims"><span class="sw" style="background:#1d2125"></span><span class="nm">Оюктардын өлчөмү</span></label>
  </div>
</details>

<div id="bar">
  <div class="seg" role="group" aria-label="Көрүнүш">
    <button id="m-finish" aria-pressed="true">Жасалга</button>
    <button id="m-build" aria-pressed="false">Конструкция</button>

  <span class="tip">Сүйрө · Скролл — масштаб</span>
  <button id="reset">Баштапкы</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const isDark = document.documentElement.dataset.theme === 'dark' ||
  (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
const BG = isDark ? 0x16191c : 0xe9eef2;
renderer.setClearColor(BG);
scene.fog = new THREE.Fog(BG, 80, 160);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xe4edf7, 0x7a6a52, 0.5));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));
const sun = new THREE.DirectionalLight(0xfff0dc, 0.85);
sun.position.set(32, 38, 30);
sun.target.position.set(9, 2, 6.75);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 130 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xb8c8ff, 0.22);
fill.position.set(-20, 15, -12);
scene.add(fill);

// ---------- Procedural textures (world-space UVs, 1 unit = 1 m) ----------
let seed = 7;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function makeTex(w, h, tileW, tileH, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / tileW, 1 / tileH);
  t.anisotropy = maxAniso;
  return t;
}
function speckle(x, w, h, n, a) {
  for (let i = 0; i < n; i++) {
    x.fillStyle = R() < .5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
    x.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2);
  }
}
function rowPieces(w, minW, maxW, fn) {
  const s = Math.floor(R() * w); let xx = s;
  while (xx < s + w) {
    let pw = minW + Math.floor(R() * (maxW - minW));
    if (xx + pw > s + w || s + w - (xx + pw) < minW) pw = s + w - xx;
    fn(xx, pw); fn(xx - w, pw); xx += pw;
  }
}
// Brick 250×65, 10 mm joints. Tile 0.52 × 0.60 m @ 400 px/m
const texBrick = makeTex(208, 240, 0.52, 0.60, (x, w, h) => {
  x.fillStyle = '#b9b9b9'; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) {
    const off = r % 2 ? 52 : 0;
    for (let k = -1; k < 3; k++) {
      const v = 228 + Math.floor(R() * 27);
      x.fillStyle = `rgb(${v},${v - 4},${v - 8})`;
      x.fillRect(k * 104 + off + 2, r * 30 + 2, 100, 26);
    }
  }
  speckle(x, w, h, 900, .06);
});
const texPlaster = makeTex(256, 256, 1, 1, (x, w, h) => {
  x.fillStyle = '#f3f2ef'; x.fillRect(0, 0, w, h); speckle(x, w, h, 5000, .035);
});
const texStone = makeTex(256, 256, 1, 1, (x, w, h) => {
  x.fillStyle = '#2a2b2d'; x.fillRect(0, 0, w, h);
  let y = 0;
  while (y < h) {
    let rh = 12 + Math.floor(R() * 16); if (h - y - rh < 12) rh = h - y;
    rowPieces(w, 26, 110, (x0, pw) => {
      const g = 78 + Math.floor(R() * 60);
      x.fillStyle = `rgb(${g + 5},${g + 3},${g})`;
      x.fillRect(x0 + 1, y + 1, pw - 2, rh - 2);
      x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(x0 + 1, y + 1, pw - 2, 2);
    });
    y += rh;
  }
  speckle(x, w, h, 2500, .08);
});
const texWood = makeTex(512, 144, 2.0, 0.56, (x, w, h) => {
  x.fillStyle = '#2b1a0e'; x.fillRect(0, 0, w, h);
  for (let b = 0; b < 4; b++) {
    const y0 = b * 36;
    rowPieces(w, 140, 330, (x0, pw) => {
      const l = 34 + R() * 14, hue = 24 + R() * 8;
      x.fillStyle = `hsl(${hue},${42 + R() * 10}%,${l}%)`;
      x.fillRect(x0 + 1, y0 + 1, pw - 2, 33);
      for (let g = 0; g < 7; g++) {
        x.fillStyle = `rgba(40,20,5,${.08 + R() * .12})`;
        x.fillRect(x0 + 1, y0 + 3 + R() * 29, pw - 2, 1);
      }
    });
  }
});
const texConcrete = makeTex(256, 256, 1, 1, (x, w, h) => {
  x.fillStyle = '#d2d2d0'; x.fillRect(0, 0, w, h); speckle(x, w, h, 6000, .07);
});
const texBlock = makeTex(480, 240, 2.4, 1.2, (x, w, h) => {
  x.fillStyle = '#d0d0ce'; x.fillRect(0, 0, w, h); speckle(x, w, h, 6000, .07);
  x.fillStyle = '#7d7f80';
  x.fillRect(0, 0, w, 3); x.fillRect(0, 120, w, 3);
  x.fillRect(0, 0, 3, 120); x.fillRect(240, 120, 3, 120);
});
const texSand = makeTex(256, 256, 1, 1, (x, w, h) => {
  x.fillStyle = '#d6c28a'; x.fillRect(0, 0, w, h); speckle(x, w, h, 9000, .12);
});
const texGrass = makeTex(256, 256, 2, 2, (x, w, h) => {
  x.fillStyle = '#6c9a46'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    x.fillStyle = `hsl(${85 + R() * 25},${35 + R() * 25}%,${28 + R() * 22}%)`;
    x.fillRect(R() * w, R() * h, 1, 2 + R() * 3);
  }
});
const texPaving = makeTex(256, 256, 1, 1, (x, w, h) => {
  x.fillStyle = '#7f8285'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const g = 150 + Math.floor(R() * 40);
    x.fillStyle = `rgb(${g},${g + 2},${g + 4})`;
    x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60);
  }
  speckle(x, w, h, 3000, .08);
});

// Porcelain floor tile 600×600
const texTile = makeTex(256, 256, 1.2, 1.2, (x, w, h) => {
  x.fillStyle = '#a9a6a0'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const g = 222 + Math.floor(R() * 14);
    x.fillStyle = `rgb(${g},${g - 2},${g - 6})`; x.fillRect(i * 128 + 1, j * 128 + 1, 126, 126);
  }
  speckle(x, w, h, 2500, .03);
});
// Goods on a shelf: tile 1.0 × 0.45 m (one shelf level)
const PAL = ['#d9503a', '#f2b33d', '#3f8f5a', '#2f6fb0', '#f4efe6', '#8a3d6b', '#e07a2f', '#5bb3c9', '#c9d14f', '#6b4a32'];
const texGoods = makeTex(256, 116, 1.0, 0.45, (x, w, h) => {
  x.fillStyle = '#2e3033'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#c9ccce'; x.fillRect(0, h - 8, w, 8);
  rowPieces(w, 12, 40, (x0, pw) => {
    const ph = 46 + Math.floor(R() * 52), c = PAL[Math.floor(R() * PAL.length)];
    x.fillStyle = c; x.fillRect(x0 + 1, h - 8 - ph, pw - 2, ph);
    x.fillStyle = 'rgba(255,255,255,0.25)'; x.fillRect(x0 + 2, h - 8 - ph + 6, pw - 4, 6);
  });
});
function signTex(text) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const x = c.getContext('2d');
  const draw = () => {
    x.fillStyle = '#23272b'; x.fillRect(0, 0, 1024, 128);
    x.fillStyle = '#d9503a'; x.fillRect(0, 118, 1024, 10);
    x.fillStyle = '#ffffff'; x.font = '600 84px "Golos Text", sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    if ('letterSpacing' in x) x.letterSpacing = '18px';
    x.fillText(text, 512, 62);
  };
  draw();
  const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso;
  if (document.fonts && document.fonts.load)
    document.fonts.load('600 84px "Golos Text"').then(() => { draw(); t.needsUpdate = true; }).catch(() => {});
  return t;
}

// ---------- Materials ----------
const S = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85 }, o));
const M = {
  ext: S({}), bear: S({}), part: S({}), plinth: S({ roughness: 0.95 }),
  frameExt: S({ roughness: 0.6 }), frameIn: S({ roughness: 0.7 }),
  stone: S({ map: texStone, roughness: 0.95 }),
  wood: S({ map: texWood, roughness: 0.7 }),
  deck: S({ map: texWood, color: 0xf0d8b8, roughness: 0.7 }),
  floor: S({ map: texTile, roughness: 0.4 }),
  porch: S({ map: texPaving, color: 0xb8bcc0, roughness: 0.8 }),
  goods: S({ map: texGoods, roughness: 0.7 }),
  shelfEnd: S({ color: 0xe9ebec, roughness: 0.5, metalness: 0.2 }),
  fridge: S({ color: 0xf2f4f5, roughness: 0.4 }),
  fridgeGlass: S({ color: 0xcfe6ff, emissive: 0x9fd0ff, emissiveIntensity: 0.35, roughness: 0.05, transparent: true, opacity: 0.7 }),
  counter: S({ color: 0x2f3236, roughness: 0.5 }),
  counterTop: S({ color: 0xf0eee9, roughness: 0.35 }),
  screen: S({ color: 0x111316, emissive: 0x2a6fb0, emissiveIntensity: 0.4 }),
  gate: S({ color: 0x8a9096, roughness: 0.45, metalness: 0.6 }),
  ramp: S({ map: texConcrete, color: 0xb4b8bb }),
  glass: S({ color: 0x8fb3d6, roughness: 0.08, metalness: 0.4, transparent: true, opacity: 0.55 }),
  winFrame: S({ color: 0x34373b, roughness: 0.5 }),
  doorEntr: S({ color: 0x2e3135, roughness: 0.45 }),
  doorIn: S({ map: texWood, color: 0xf5e6cf, roughness: 0.6 }),
  metal: S({ color: 0xc9ccce, roughness: 0.3, metalness: 0.8 }),
  rail: S({ color: 0x3a3c3f, roughness: 0.5, metalness: 0.3 }),
  block: S({ map: texBlock, color: 0xc4c7ca }),
  footing: S({ map: texConcrete, color: 0xb4b8bb }),
  sand: S({ map: texSand }),
  soil: S({ color: 0x7a5c40, roughness: 1 }),
  pitFloor: S({ color: 0x8a6c4c, roughness: 1 }),
  grass: S({ map: texGrass, roughness: 1 }),
  paving: S({ map: texPaving, roughness: 0.9 }),
  mulch: S({ color: 0x4a3626, roughness: 1 }),
  bush: S({ color: 0x4f7a34, roughness: 0.95 }),
  bushLight: S({ color: 0x6b9440, roughness: 0.95 }),
};
let mode = 'finish';
function setMat(m, map, color) { m.map = map; m.color.setHex(color); m.needsUpdate = true; }
function applyMode() {
  if (mode === 'finish') {
    setMat(M.ext, texPlaster, 0xffffff);
    setMat(M.bear, texPlaster, 0xefe9e1);
    setMat(M.part, texPlaster, 0xf6f3ee);
    setMat(M.plinth, texStone, 0xffffff);
    setMat(M.frameExt, null, 0x5f5851);
    setMat(M.frameIn, texPlaster, 0xefe9e1);
  } else {
    setMat(M.ext, texBrick, 0xd68858);
    setMat(M.bear, texBrick, 0xb36a43);
    setMat(M.part, texBrick, 0xe8bd8c);
    setMat(M.plinth, texConcrete, 0xa9adb0);
    setMat(M.frameExt, texConcrete, 0xbfc3c6);
    setMat(M.frameIn, texConcrete, 0xbfc3c6);
  }
}

// ---------- Groups: category × level (0 = site/foundation, 1, 2) ----------
const groups = [];
const gmap = {};
let LV = 0;                     // current level while building
function grp(cat, lv = LV) {
  const k = cat + '@' + lv;
  if (!gmap[k]) { const g = new THREE.Group(); g.userData = { cat, lv }; scene.add(g); gmap[k] = g; groups.push(g); }
  return gmap[k];
}
function worldUV(g, cx, cy, cz) {
  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i) + cx, y = p.getY(i) + cy, z = p.getZ(i) + cz;
    if (Math.abs(n.getX(i)) > .5) uv.setXY(i, z, y);
    else if (Math.abs(n.getY(i)) > .5) uv.setXY(i, x, z);
    else uv.setXY(i, x, y);
  }
  uv.needsUpdate = true;
}
function box(w, h, d, mat, x, y, z, g, noShadow) {
  const geo = new THREE.BoxGeometry(w, h, d);
  worldUV(geo, x, y, z);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = !noShadow; m.receiveShadow = true;
  g.add(m);

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function sprite(cv, x, y, z, sx, sy, g) {
  const t = new THREE.CanvasTexture(cv); t.anisotropy = maxAniso;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
  sp.position.set(x, y, z); sp.scale.set(sx, sy, 1); sp.renderOrder = 10; g.add(sp);
}
function addDim({ p, text, lv }) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '500 26px "Golos Text", sans-serif';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(20,24,28,0.78)'; roundRect(ctx, 128 - tw / 2 - 12, 12, tw + 24, 40, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 128, 33);
  sprite(c, p[0], p[1], p[2], 2.0, 0.5, grp('dims', lv));
}
function addAxis(x, z, text) {
  const c = document.createElement('canvas'); c.width = 96; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.beginPath(); ctx.arc(48, 48, 40, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#3d5a6c'; ctx.stroke();
  ctx.fillStyle = '#1d2125'; ctx.font = '600 40px "Golos Text", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 48, 50);
  sprite(c, x, 0.4, z, 1.1, 1.1, grp('labels', 0));
}
function addRoom(lv, x, z, text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const ctx = c.getContext('2d');
  ctx.font = '500 30px "Golos Text", sans-serif';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = lv === 2 ? 'rgba(122,86,52,0.92)' : 'rgba(61,90,108,0.9)';
  roundRect(ctx, 256 - tw / 2 - 20, 16, tw + 40, 58, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 46);
  sprite(c, x, (lv === 2 ? STOREY : 0) + 1.5, z, 3, 0.56, grp('labels', lv));
}

// ---------- Orbit controls ----------
const HOME = { theta: 0.62, phi: 1.02, radius: 46 };
let { theta, phi, radius } = HOME;
const target = new THREE.Vector3(9, 2.2, 6.75);
function updateCam() {
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.cos(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(target);
}
updateCam();
let drag = false, lx = 0, ly = 0, touches = 0;
canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag || touches > 1) return;
  theta -= (e.clientX - lx) * 0.005;
  phi = Math.max(0.15, Math.min(1.62, phi - (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY; updateCam();
});
const end = () => drag = false;
canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); radius = Math.max(10, Math.min(85, radius + e.deltaY * 0.04)); updateCam();
}, { passive: false });
let pinch = 0;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
canvas.addEventListener('touchstart', e => { touches = e.touches.length; if (touches === 2) pinch = dist(e.touches); }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) { const d = dist(e.touches); radius = Math.max(10, Math.min(85, radius - (d - pinch) * 0.06)); pinch = d; updateCam(); }
}, { passive: true });
canvas.addEventListener('touchend', e => { touches = e.touches.length; if (touches === 1) { lx = e.touches[0].clientX; ly = e.touches[0].clientY; } }, { passive: true });
document.getElementById('reset').onclick = () => { ({ theta, phi, radius } = HOME); updateCam(); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);

setMode('finish');
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();
