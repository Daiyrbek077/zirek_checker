<!DOCTYPE html>
<html lang="ky" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Акыл Ордо - Жооп жөнөтүү</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-400">Жоопту жөнөтүү</h2>
        
        <form id="replyForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Студенттин номери</label>
                <input type="tel" id="whatsappNumber" required 
                    class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 placeholder-gray-500"
                    placeholder="996555123456">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Жооптун шилтемеси</label>
                <input type="url" id="answerLink" required 
                    class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 placeholder-gray-500"
                    placeholder="https://akyl-ordo.vercel.app/...">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                Түз жөнөтүү
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center hidden font-medium"></div>
    </div>

    <script>
        document.getElementById('replyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');
            btn.innerText = "Жөнөтүлүүдө...";
            btn.disabled = true;
            
            let number = document.getElementById('whatsappNumber').value.replace(/[^0-9]/g, '');
            if (number.startsWith('0')) number = '996' + number.substring(1);
            
            const link = document.getElementById('answerLink').value;

            try {
                // Vercel'дин ички API'сине кайрылуу
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, link })
                });

                const result = await response.json();

                if (response.ok) {
                    status.textContent = "✓ WhatsApp аркылуу ийгиликтүү жөнөтүлдү!";
                    status.className = "mt-4 text-center text-green-400 font-medium";
                    document.getElementById('replyForm').reset();
                } else {
                    status.textContent = "Ката кетти: " + (result.error || "Белгисиз ката");
                    status.className = "mt-4 text-center text-red-400 font-medium";
                }
            } catch (error) {
                status.textContent = "Сервер менен байланыш үзүлдү.";
                status.className = "mt-4 text-center text-red-400 font-medium";
            } finally {
                btn.innerText = "Түз жөнөтүү";
                btn.disabled = false;
                status.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
